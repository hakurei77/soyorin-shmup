<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="#ffffff">
  <defs>
    <mask id="storage-layer">
      <rect width="24" height="24" fill="#fff" />
      <!-- 立方体棱边切线 -->
      <path d="M12 11.8 L12 21.4" stroke="#000" stroke-width="1.3" />
      <path d="M12 11.8 L3.9 7.3" stroke="#000" stroke-width="1.3" />
      <path d="M12 11.8 L20.1 7.3" stroke="#000" stroke-width="1.3" />
      <!-- 箱盖分层线 -->
      <path d="M3.9 9.6 L12 14.1 L20.1 9.6" stroke="#000" stroke-width="1.2" fill="none" />
    </mask>
  </defs>
  <!-- 后方叠箱线框（错位层次） -->
  <polygon
    points="12,0.9 19.8,5.2 12,9.5 4.2,5.2"
    fill="none"
    stroke="#ffffff"
    stroke-width="1"
    opacity="0.5"
  />
  <!-- 主货箱 -->
  <polygon
    mask="url(#storage-layer)"
    points="12,3 20.6,7.8 20.6,17.4 12,22.2 3.4,17.4 3.4,7.8"
  />
  <!-- 侧面标签方块 -->
  <rect x="5.4" y="13.2" width="2.2" height="2.2" />
</svg>
