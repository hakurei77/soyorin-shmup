<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="#ffffff">
  <defs>
    <mask id="missions-layer">
      <rect width="24" height="24" fill="#fff" />
      <!-- 折角切线 -->
      <path d="M14.8 3.2 L18.4 6.8" stroke="#000" stroke-width="1.2" />
      <!-- 文字行负空间 -->
      <path d="M8.4 9 L15.6 9" stroke="#000" stroke-width="1.2" />
      <path d="M8.4 12.2 L15.6 12.2" stroke="#000" stroke-width="1.2" />
      <path d="M8.4 15.4 L12.6 15.4" stroke="#000" stroke-width="1.2" />
    </mask>
  </defs>
  <!-- 左侧装订层（错位叠压） -->
  <polygon points="3.4,5.4 5.8,5.4 5.8,19.4 3.4,19.4" />
  <!-- 主文档：折角 + 文字行切分 -->
  <polygon
    mask="url(#missions-layer)"
    points="6.8,3.2 14.8,3.2 18.4,6.8 18.4,21 6.8,21"
  />
  <!-- 完成勾：压出文档右缘 -->
  <polygon points="13.6,17.2 15.4,19 20.8,13.6 19.6,12.4 15.4,16.6 14.8,16" />
  <!-- 装饰小方块 -->
  <rect x="3.4" y="2.6" width="2" height="2" />
</svg>
