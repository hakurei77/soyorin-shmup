<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="#ffffff">
  <defs>
    <mask id="sortie-layer">
      <rect width="24" height="24" fill="#fff" />
      <!-- 横向切线，把楔形切成三层 -->
      <path d="M4 10.6 L20 10.6" stroke="#000" stroke-width="1.3" />
      <path d="M5 15.6 L19 15.6" stroke="#000" stroke-width="1.3" />
    </mask>
  </defs>
  <!-- 主体：三层切分的出击楔形 -->
  <polygon
    mask="url(#sortie-layer)"
    points="12,1.8 20.5,13.6 20.5,18.8 12,14.4 3.5,18.8 3.5,13.6"
  />
  <!-- 尾焰 -->
  <polygon points="12,17.2 16,22.4 8,22.4" />
  <!-- 两侧装饰小方块 -->
  <rect x="21.6" y="8.6" width="1.9" height="1.9" />
  <rect x="0.5" y="8.6" width="1.9" height="1.9" />
</svg>
